[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Adaptive Task Lifecycle Engine for Staged Artifact Processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "BinReaperMekanix" }]
keywords = ["pipeline", "orchestration", "batch-processing", "workflow", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Pipeline",
]

dependencies = [
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
rabbitmq = ["aio-pika>=0.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
